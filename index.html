<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.png">

  <title>Barteli Bolsas</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3eee9;
      scroll-behavior: smooth;
    }

    header {
      background: #5a3e36;
      color: white;
      text-align: center;
      padding: 60px 20px;
      font-family: 'Playfair Display';
      background: linear-gradient(135deg, #5a3e36, #3d2a24);



    }

    header h1 {
      font-size: 52px;
      margin: 10px 0;
    }

    header p {
      letter-spacing: 2px;
      opacity: 0.9;
    }



    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    }

    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .card-content h3 {
      margin: 0;
      color: #5a3e36;
    }

    .card-content {
      padding: 18px;
    }

    .price {
      color: #5a3e36;
      font-weight: bold;
      font-size: 18px;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-content {
      background: #fffaf7;
      width: 90%;
      max-width: 500px;
      padding: 20px;
      border-radius: 18px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal img {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 12px;
    }

    .gallery {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      overflow-x: auto;
    }

    .gallery img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
    }

    .colors {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .btn {
      margin-top: 20px;
      display: block;
      text-align: center;
      background: #5a3e36;
      color: white;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }

    #descricao {
      margin-top: 10px;
      line-height: 1.5;
      color: #555;
    }

    /* ADMIN */

    #abrirAdmin {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #5a3e36;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1000;
      font-size: 18px;
      opacity: 0.5;
      transition: 0.3s;
    }

    #painelAdmin {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      width: 320px;
      height: 100%;
      background: white;
      padding: 20px;
      box-shadow: -4px 0 12px rgba(0, 0, 0, 0.1);
      overflow-y: auto;
      z-index: 2000;
    }

    #painelAdmin input,
    #painelAdmin textarea {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      box-sizing: border-box;
    }

    #painelAdmin button {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #5a3e36;
      color: white;
      cursor: pointer;
    }

    .prod-admin {
      background: #f3eee9;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .editar-btn {
      background: #1d3557 !important;
    }

    .remover-btn {
      background: red !important;
    }

    .logo {
      width: 160px;
      max-width: 90%;
      margin-bottom: 15px;
      border-radius: 24px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
      transition: 0.3s;
    }

    .logo:hover {
      transform: scale(1.03);
    }
  </style>
</head>

<body>

  <header>

    <img src="logo.png" class="logo">

    <h1>Barteli Bolsas</h1>

    <p>Elegância em cada detalhe</p>

  </header>

  <div class="container">
    <div class="grid" id="lista"></div>
  </div>

  <!-- MODAL -->

  <div class="modal" id="modal" onclick="fecharModal()">

    <div class="modal-content" onclick="event.stopPropagation()">

      <img id="imgPrincipal">

      <div class="gallery" id="galeria"></div>

      <div class="colors" id="cores"></div>

      <h2 id="titulo"></h2>

      <p class="price" id="preco"></p>

      <p id="descricao"></p>

      <a class="btn" onclick="comprar()">
        Comprar no WhatsApp
      </a>

    </div>

  </div>

  <!-- BOTÃO ADMIN -->

  <button id="abrirAdmin" onclick="abrirPainel()">
    ⚙️
  </button>

  <!-- PAINEL ADMIN -->

  <div id="painelAdmin">

    <h2>Painel Admin</h2>

    <button onclick="fecharPainel()" style="background:red;margin-bottom:15px;">
      Fechar
    </button>

    <input type="password" id="senhaAdmin" placeholder="Senha">

    <button onclick="entrarAdmin()">
      Entrar
    </button>

    <div id="conteudoAdmin" style="display:none;">

      <hr>

      <h3>Adicionar Produto</h3>

      <input type="text" id="novoNome" placeholder="Nome do produto">

      <input type="text" id="novoPreco" placeholder="Preço">

      <textarea id="novaDescricao" placeholder="Descrição" style="height:90px;"></textarea>

      <input type="file" id="novaImagem" accept="image/*" multiple>

      <input type="text" id="novasCores" placeholder="Cores HEX separadas por vírgula">

      <button onclick="adicionarProduto()">
        Adicionar Produto
      </button>

      <hr>

      <h3>Produtos cadastrados</h3>

      <div id="listaAdmin"></div>

    </div>

  </div>

  <!-- FIREBASE -->

  <script type="module">

    import { initializeApp }
      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      deleteDoc,
      doc,
      updateDoc
    }
      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    import {
      getStorage,
      ref,
      uploadBytes,
      getDownloadURL
    }
      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

    const firebaseConfig = {

      apiKey: "AIzaSyAhUPmNMslmx70HMiGo5gpsvS69zXe5ID4",

      authDomain: "barteli-bolsas.firebaseapp.com",

      projectId: "barteli-bolsas",

      storageBucket: "barteli-bolsas.firebasestorage.app",

      messagingSenderId: "840758366177",

      appId: "1:840758366177:web:d1a902e1846f9f19284ca0"

    };

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const storage = getStorage(app);

    window.db = db;
    window.storage = storage;

    window.collection = collection;
    window.addDoc = addDoc;
    window.getDocs = getDocs;
    window.deleteDoc = deleteDoc;
    window.doc = doc;
    window.updateDoc = updateDoc;
    window.ref = ref;
    window.uploadBytes = uploadBytes;
    window.getDownloadURL = getDownloadURL;

  </script>

  <!-- SCRIPT -->

  <script type="module">

    let produtos = [];

    let produtoAtual = null;

    const lista =
      document.getElementById('lista');

    /* RENDER */

    function renderizarProdutos() {

      lista.innerHTML = '';

      produtos.forEach((p, index) => {

        const div =
          document.createElement('div');

        div.className = 'card';

        const imagemPrincipal =
          p.imagens && p.imagens.length > 0
            ? p.imagens[0]
            : 'https://via.placeholder.com/300x300?text=Sem+Imagem';

        div.innerHTML = `

<img src="${imagemPrincipal}">

<div class="card-content">
  <h3>${p.nome}</h3>
  <p class="price">R$ ${p.preco}</p>
</div>

`;

        div.addEventListener(
          'click',
          () => abrirModal(index)
        );

        lista.appendChild(div);

      });

    }

    /* CARREGAR */

    async function carregarProdutos() {

      produtos = [];

      const querySnapshot =
        await getDocs(
          collection(db, 'produtos')
        );

      querySnapshot.forEach((docItem) => {

        produtos.push({

          id: docItem.id,

          ...docItem.data()

        });

      });

      renderizarProdutos();

      atualizarListaAdmin();

    }

    carregarProdutos();

    /* MODAL */

    function abrirModal(index) {

      produtoAtual = produtos[index];

      document.getElementById('modal')
        .style.display = 'flex';

      document.getElementById('titulo')
        .innerText = produtoAtual.nome;

      document.getElementById('preco')
        .innerText = 'R$ ' + produtoAtual.preco;

      document.getElementById('descricao')
        .innerText = produtoAtual.descricao || '';

      document.getElementById('imgPrincipal')
        .src =
        produtoAtual.imagens &&
          produtoAtual.imagens.length > 0
          ? produtoAtual.imagens[0]
          : 'https://via.placeholder.com/300x300?text=Sem+Imagem';

      /* GALERIA */

      const galeria =
        document.getElementById('galeria');

      galeria.innerHTML = '';

      produtoAtual.imagens.forEach((img, index) => {

        const thumb =
          document.createElement('img');

        thumb.src = img;

        thumb.onclick =
          () => trocarImagem(index);

        galeria.appendChild(thumb);

      });

      /* CORES */

     /* CORES */

const coresDiv =
  document.getElementById('cores');

coresDiv.innerHTML = '';

if (produtoAtual.cores) {

  produtoAtual.cores.forEach((cor, index) => {

    const bolinha =
      document.createElement('button');

    bolinha.className =
      'color-btn';

    bolinha.style.background =
      cor;

    bolinha.onclick =
      () => trocarImagem(index);

    coresDiv.appendChild(bolinha);

  });

}}



    function trocarImagem(index) {

      document.getElementById('imgPrincipal')
        .src = produtoAtual.imagens[index];

    }

    function fecharModal() {

      document.getElementById('modal')
        .style.display = 'none';

    }

    /* WHATSAPP */

    function comprar() {

      const msg =
        `Olá! Tenho interesse na bolsa: ${produtoAtual.nome} 😊`;

      const url =
        `https://wa.me/559492664045?text=${encodeURIComponent(msg)}`;

      window.open(url, '_blank');

    }

    /* ADMIN */

    function abrirPainel() {

      document.getElementById('painelAdmin')
        .style.display = 'block';

    }

    function fecharPainel() {

      document.getElementById('painelAdmin')
        .style.display = 'none';

    }

    function entrarAdmin() {

      const senha =
        document.getElementById('senhaAdmin')
          .value;

      if (senha === 'Barteli2026@') {

        document.getElementById('conteudoAdmin')
          .style.display = 'block';

        atualizarListaAdmin();

      } else {

        alert('Senha incorreta');

      }

    }

    /* LISTA ADMIN */

    function atualizarListaAdmin() {

      const listaAdmin =
        document.getElementById('listaAdmin');

      listaAdmin.innerHTML = '';

      produtos.forEach((p, index) => {

        const div =
          document.createElement('div');

        div.className =
          'prod-admin';

        div.innerHTML = `

    <strong>${p.nome}</strong>

    <input
    type="file"
    id="fotoExtra${index}"
    multiple
    accept="image/*"
    style="
    margin-top:10px;
    margin-bottom:10px;
    ">

    <button
    onclick="adicionarFotos(${index})"
    style="background:#1d3557;">
    Adicionar Fotos
    </button>

    <button
    class="editar-btn"
    onclick="editarProduto(${index})">
    Editar
    </button>

    <button
    class="remover-btn"
    onclick="removerProduto(${index})">
    Remover
    </button>

    `;

        listaAdmin.appendChild(div);

      });

    }

    /* ADICIONAR PRODUTO */

    async function adicionarProduto() {

      const nome =
        document.getElementById('novoNome').value;

      const preco =
        document.getElementById('novoPreco').value;

      const descricao =
        document.getElementById('novaDescricao').value;

      const arquivos =
        document.getElementById('novaImagem').files;

      const coresTexto =
        document.getElementById('novasCores').value;

      if (!nome || !preco || arquivos.length === 0) {

        alert('Preencha todos os campos');

        return;

      }
      alert('Enviando imagens...');

      let imagens = [];

      for (let i = 0; i < arquivos.length; i++) {

        const arquivo = arquivos[i];

        const storageRef =
          ref(
            storage,
            'produtos/' + Date.now() + arquivo.name
          );

        await uploadBytes(
          storageRef,
          arquivo
        );

        const url =
          await getDownloadURL(storageRef);

        imagens.push(url);

      }

      let cores = coresTexto
        ? coresTexto.split(',').map(cor => cor.trim())
        : [];
      console.log(imagens);

      await addDoc(

        collection(db, 'produtos'),

        {

          nome: nome,
          preco: preco,
          descricao: descricao,
          imagens: imagens,
          cores: cores

        }

      );

      carregarProdutos();
      document.getElementById('novoNome').value = '';
      document.getElementById('novoPreco').value = '';
      document.getElementById('novaDescricao').value = '';
      document.getElementById('novaImagem').value = '';
      document.getElementById('novasCores').value = '';

      alert('Produto adicionado');

    }

    /* ADICIONAR FOTOS */

    async function adicionarFotos(index) {

      const arquivos =
        document.getElementById(
          `fotoExtra${index}`
        ).files;

      if (arquivos.length === 0) {

        alert('Selecione imagens');

        return;

      }

      let novasImagens =
        [...produtos[index].imagens];

      for (let i = 0; i < arquivos.length; i++) {

        const arquivo = arquivos[i];

        const storageRef =
          ref(
            storage,
            'produtos/' + Date.now() + arquivo.name
          );

        await uploadBytes(
          storageRef,
          arquivo
        );

        const url =
          await getDownloadURL(storageRef);

        novasImagens.push(url);

      }

      await updateDoc(

        doc(db, 'produtos', produtos[index].id),

        {

          imagens: novasImagens

        }

      );

      carregarProdutos();

      alert('Fotos adicionadas');

    }
    /* EDITAR */

    async function editarProduto(index) {

      const produto = produtos[index];

      const novoNome =
        prompt('Novo nome:', produto.nome);

      const novoPreco =
        prompt('Novo preço:', produto.preco);

      const novaDescricao =
        prompt(
          'Nova descrição:',
          produto.descricao || ''
        );

      if (!novoNome || !novoPreco) {

        return;

      }

      await updateDoc(

        doc(db, 'produtos', produto.id),

        {

          nome: novoNome,
          preco: novoPreco,
          descricao: novaDescricao

        }

      );

      carregarProdutos();

      alert('Produto atualizado');

    }

    /* REMOVER */

    async function removerProduto(index) {

      const produto =
        produtos[index];

      await deleteDoc(

        doc(
          db,
          'produtos',
          produto.id
        )

      );

      carregarProdutos();

    }
    window.abrirPainel = abrirPainel;
    window.fecharPainel = fecharPainel;
    window.entrarAdmin = entrarAdmin;
    window.adicionarProduto = adicionarProduto;
    window.adicionarFotos = adicionarFotos;
    window.editarProduto = editarProduto;
    window.removerProduto = removerProduto;
    window.fecharModal = fecharModal;
    window.comprar = comprar;

  </script>

</body>

</html>
