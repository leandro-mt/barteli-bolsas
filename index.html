<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barteli Bolsas</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f3eee9;
}

header{
  background:#5a3e36;
  color:white;
  text-align:center;
  padding:20px;
  font-family:'Playfair Display';
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
  cursor:pointer;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
}

.card-content{
  padding:15px;
}

.price{
  color:#5a3e36;
  font-weight:bold;
  font-size:18px;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-content{
  background:#fffaf7;
  width:90%;
  max-width:500px;
  padding:20px;
  border-radius:18px;
  max-height:90vh;
  overflow-y:auto;
}

.modal img{
  width:100%;
  max-height:350px;
  object-fit:cover;
  border-radius:12px;
}

.gallery{
  display:flex;
  gap:8px;
  margin-top:10px;
  overflow-x:auto;
}

.gallery img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:8px;
  cursor:pointer;
}

.colors{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.color-btn{
  width:28px;
  height:28px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.btn{
  margin-top:20px;
  display:block;
  text-align:center;
  background:#5a3e36;
  color:white;
  padding:14px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
}

/* BOTÃO ADMIN */

#abrirAdmin{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#5a3e36;
  color:white;
  border:none;
  padding:14px;
  border-radius:50%;
  cursor:pointer;
  z-index:1000;
  font-size:18px;
}

/* PAINEL ADMIN */

#painelAdmin{
  display:none;
  position:fixed;
  top:0;
  right:0;
  width:320px;
  height:100%;
  background:white;
  padding:20px;
  box-shadow:-4px 0 12px rgba(0,0,0,0.1);
  overflow-y:auto;
  z-index:2000;
}

#painelAdmin input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ddd;
  box-sizing:border-box;
}

#painelAdmin button{
  margin-top:12px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#5a3e36;
  color:white;
  cursor:pointer;
}

.prod-admin{
  background:#f3eee9;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}

.prod-admin button{
  background:red !important;
}

</style>
</head>

<body>

<header>
  <h1>Barteli Bolsas</h1>
  <p>Elegância em cada detalhe</p>
</header>

<!-- PRODUTOS -->

<div class="container">
  <div class="grid" id="lista"></div>
</div>

<!-- MODAL -->

<div class="modal" id="modal" onclick="fecharModal()">

  <div class="modal-content" onclick="event.stopPropagation()">

    <img id="imgPrincipal">

    <div class="gallery" id="galeria"></div>

    <!-- CORES -->
    <div class="colors" id="cores"></div>

    <h2 id="titulo"></h2>

    <p class="price" id="preco"></p>

    <a class="btn" onclick="comprar()">
      Comprar no WhatsApp
    </a>

  </div>

</div>

<!-- BOTÃO ADMIN -->

<button id="abrirAdmin" onclick="abrirPainel()">
⚙️
</button>

<!-- PAINEL ADMIN -->

<div id="painelAdmin">

<h2>Painel Admin</h2>

<input type="password" id="senhaAdmin" placeholder="Senha">

<button onclick="entrarAdmin()">
Entrar
</button>

<div id="conteudoAdmin" style="display:none;">

<hr>

<h3>Adicionar Produto</h3>

<input type="text" id="novoNome" placeholder="Nome do produto">

<input type="text" id="novoPreco" placeholder="Preço">

<input type="file"
id="novaImagem"
accept="image/*"
multiple>

<input type="text"
id="novasCores"
placeholder="Cores HEX separadas por vírgula">

<button onclick="adicionarProduto()">
Adicionar Produto
</button>

<hr>

<h3>Produtos cadastrados</h3>

<div id="listaAdmin"></div>

</div>

</div>

<script>

/* PRODUTOS */

let produtos = JSON.parse(localStorage.getItem('produtos')) || [

{
  nome:'Bolsa Elegance Rosé',
  preco:'129,90',
  imagens:[
    'img/rose.jpg',
    'img/marsala.jpg',
    'img/caramelo.jpg'
  ],
  cores:[
    '#8a1538',
    '#c58b55',
    '#d8c3a5'
  ]
},

{
  nome:'Bolsa Tiffany',
  preco:'139,90',
  imagens:[
    'img/tiffany.jpg',
    'img/rose.jpg'
  ],
  cores:[
    '#f5e6dc',
    '#ff69b4'
  ]
},

{
  nome:'Mochila Premium',
  preco:'159,90',
  imagens:[
    'img/mochila1.jpg',
    'img/mochila2.jpg'
  ],
  cores:[
    '#5a3e36',
    '#1d3557'
  ]
}

];

let produtoAtual = null;

const lista = document.getElementById('lista');

/* RENDERIZAR */

function renderizarProdutos(){

  lista.innerHTML = '';

  produtos.forEach((p,index)=>{

    const div = document.createElement('div');

    div.className = 'card';

    div.innerHTML = `
      <img src="${p.imagens[0]}">

      <div class="card-content">
        <h3>${p.nome}</h3>
        <p class="price">R$ ${p.preco}</p>
      </div>
    `;

    div.addEventListener('click',()=>abrirModal(index));

    lista.appendChild(div);

  });

}

renderizarProdutos();

/* MODAL */

function abrirModal(index){

  produtoAtual = produtos[index];

  document.getElementById('modal').style.display = 'flex';

  document.getElementById('titulo').innerText =
  produtoAtual.nome;

  document.getElementById('preco').innerText =
  'R$ ' + produtoAtual.preco;

  document.getElementById('imgPrincipal').src =
  produtoAtual.imagens[0];

  /* GALERIA */

  const galeria =
  document.getElementById('galeria');

  galeria.innerHTML = '';

  produtoAtual.imagens.forEach((img,index)=>{

    const thumb =
    document.createElement('img');

    thumb.src = img;

    thumb.onclick = ()=>trocarImagem(index);

    galeria.appendChild(thumb);

  });

  /* CORES */

  const coresDiv =
  document.getElementById('cores');

  coresDiv.innerHTML = '';

  if(produtoAtual.cores){

    produtoAtual.cores.forEach((cor,index)=>{

      const bolinha =
      document.createElement('button');

      bolinha.className = 'color-btn';

      bolinha.style.background = cor;

      bolinha.onclick = ()=>trocarImagem(index);

      coresDiv.appendChild(bolinha);

    });

  }

}

function fecharModal(){

  document.getElementById('modal').style.display =
  'none';

}

function trocarImagem(index){

  document.getElementById('imgPrincipal').src =
  produtoAtual.imagens[index];

}

/* WHATSAPP */

function comprar(){

  let msg =
  `Olá! Quero comprar: ${produtoAtual.nome}`;

  let url =
  `https://wa.me/559492664045?text=${encodeURIComponent(msg)}`;

  window.open(url,'_blank');

}

/* ADMIN */

function abrirPainel(){

  document.getElementById('painelAdmin').style.display =
  'block';

}

function entrarAdmin(){

  const senha =
  document.getElementById('senhaAdmin').value;

  if(senha === '1234'){

    document.getElementById('conteudoAdmin').style.display =
    'block';

    atualizarListaAdmin();

  }else{

    alert('Senha incorreta');

  }

}

/* LISTA ADMIN */

function atualizarListaAdmin(){

  const listaAdmin =
  document.getElementById('listaAdmin');

  listaAdmin.innerHTML = '';

  produtos.forEach((p,index)=>{

    const div =
    document.createElement('div');

    div.className = 'prod-admin';

    div.innerHTML = `
      <strong>${p.nome}</strong>

      <button onclick="removerProduto(${index})">
      Remover
      </button>
    `;

    listaAdmin.appendChild(div);

  });

}

/* ADICIONAR PRODUTO */

function adicionarProduto(){

  const nome =
  document.getElementById('novoNome').value;

  const preco =
  document.getElementById('novoPreco').value;

  const arquivos =
  document.getElementById('novaImagem').files;

  const coresTexto =
  document.getElementById('novasCores').value;

  if(!nome || !preco || arquivos.length === 0){

    alert('Preencha todos os campos');

    return;

  }

  let imagens = [];

  for(let i=0; i<arquivos.length; i++){

    imagens.push(
      URL.createObjectURL(arquivos[i])
    );

  }

  let cores = coresTexto
  .split(',')
  .map(cor => cor.trim());

  produtos.push({

    nome:nome,
    preco:preco,
    imagens:imagens,
    cores:cores

  });

  localStorage.setItem(
    'produtos',
    JSON.stringify(produtos)
  );

  renderizarProdutos();

  atualizarListaAdmin();

  alert('Produto adicionado');

}

/* REMOVER */

function removerProduto(index){

  produtos.splice(index,1);

  localStorage.setItem(
    'produtos',
    JSON.stringify(produtos)
  );

  renderizarProdutos();

  atualizarListaAdmin();

}

</script>

</body>
</html>
